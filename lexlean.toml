spec = "lexlean/project/1"
name = "echobraid-proofs"
language = "1.2"
module_prefix = "EchoBraidProofs"
source_roots = ["app/src", "proofs"]
entrypoints = ["proofs/Laws/BreathLaws.lex.tex", "proofs/Laws/ConsentLaws.lex.tex", "proofs/Laws/LogicLaws.lex.tex", "proofs/Laws/MemoryLaws.lex.tex", "proofs/Laws/ReflectionLaws.lex.tex", "proofs/Laws/ResonanceLaws.lex.tex", "proofs/Laws/RetentionLaws.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "echobraid.domain"
kind = "path"
path = "app/language/echobraid.domain"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "app/language/prism.arch"

[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 300000
